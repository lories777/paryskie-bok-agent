name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  masterlink-connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectors/masterlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: connectors/masterlink/package-lock.json
      - run: npm ci
      - run: npm run verify
